<style>:root{--bg:#f5f6f8;--card:#fff;--ink:#1f2329;--sub:#6b7280;--line:#eceef1;--up:#e03b3b;--down:#1aa260;--brand:#2b5cff;--brand-soft:#eef2ff;--amber:#c88217;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7;}
.wrap{max-width:680px;margin:0 auto;padding:16px 14px 48px;}
.back{display:inline-block;color:var(--brand);font-size:13px;text-decoration:none;margin:6px 0 10px;}
header{padding:4px 0 10px;border-bottom:1px solid var(--line);}
.date{font-size:13px;color:var(--sub);}
.title{font-size:20px;font-weight:700;margin:2px 0 0;}
.note{font-size:12px;color:var(--sub);margin:8px 0;background:#f8f9fb;border:1px solid var(--line);border-radius:10px;padding:8px 12px;}
h2{font-size:16px;margin:22px 0 10px;}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.sec h3{font-size:15px;margin:0 0 8px;}
.sec p{margin:6px 0;font-size:14px;}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line);}
.kv:last-child{border-bottom:none;}
.kv .r{text-align:right;color:var(--sub);}
.kv .r b{color:var(--ink);}
.up{color:var(--up);font-weight:600;}
.down{color:var(--down);font-weight:600;}
.amber{color:var(--amber);font-weight:600;}
.muted{font-size:12px;color:var(--sub);}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03);display:block;text-decoration:none;color:inherit;}
.card .date{font-size:13px;color:var(--sub);}
.card .day{font-weight:700;font-size:15px;margin:2px 0 0;}
footer{color:var(--sub);font-size:12px;text-align:center;margin-top:24px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{color:var(--sub);font-weight:600;font-size:12px;}
.table-wrap{overflow-x:auto;}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);margin-left:6px;}
.tag-hot{background:#ffeaea;color:#b3261e;}
.tag-cold{background:#e6f7ec;color:#1a8a3c;}
.bar{height:8px;border-radius:999px;background:#eef0f3;overflow:hidden;margin:4px 0;}
.bar>i{display:block;height:100%;background:var(--brand);}
.gauge{height:10px;border-radius:999px;background:#eef0f3;overflow:hidden;margin:8px 0 4px;}
.gauge>i{display:block;height:100%;}

.snapshot-badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:#eef2ff;color:#2b5cff;margin-left:8px;font-weight:600;}
</style>
