<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭 A 股复盘站</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#1f2329; --sub:#6b7280; --line:#eceef1;
    --up:#e03b3b; --down:#1aa260; --brand:#2b5cff; --brand-soft:#eef2ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;}
  .wrap{max-width:680px;margin:0 auto;padding:16px 14px 48px;}
  header{padding:18px 0 6px;}
  .title{font-size:20px;font-weight:700;margin:0;}
  .sub{color:var(--sub);font-size:13px;margin-top:4px;}
  /* 模块分区 */
  .module{margin-top:22px;}
  .module-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:0 0 10px;padding-left:10px;border-left:4px solid var(--brand);}
  .module-h .ico{font-size:17px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03);display:block;text-decoration:none;color:inherit;}
  .card .date{font-size:13px;color:var(--sub);}
  .card .day{font-weight:700;font-size:16px;margin:2px 0 8px;}
  .card .sum{font-size:14px;}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:#e6f7ec;color:#1a8a3c;margin-left:6px;vertical-align:middle;}
  .empty{color:var(--sub);text-align:center;padding:40px 0;font-size:14px;}
  footer{color:var(--sub);font-size:12px;text-align:center;margin-top:28px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="title">家庭 A 股复盘站</h1>
    <div class="sub">AI 每个交易日收盘后生成 · 家庭共享 · 长期积累</div>
  </header>

  <!-- 模块 1：我的关注个股 -->
  <section class="module">
    <h2 class="module-h"><span class="ico">📌</span>我的关注个股</h2>
    <a class="card" href="watchlist.html">
      <div class="date">跟踪标的</div>
      <div class="day">查看关注个股与所属板块、当日盘面表现 →</div>
    </a>
  </section>

  <!-- 模块 2：市场周期数据观测 -->
  <section class="module">
    <h2 class="module-h"><span class="ico">📈</span>市场周期数据观测</h2>
    <a class="card" href="market-cycle/index.html">
      <div class="date">量能 / 资金 / 板块 / 周期</div>
      <div class="day">四维度原始数据 + 周期阶段与资金性质判断（每个交易日更新）→</div>
    </a>
  </section>

  <!-- 模块 3：每日复盘 -->
  <section class="module">
    <h2 class="module-h"><span class="ico">🗓️</span>每日复盘</h2>
    <div id="list"></div>
  </section>

  <footer>数据来源于公开行情，可能存在延迟 ｜ 仅供家庭内部学习交流，不构成投资建议</footer>
</div>
<script>
  const el = document.getElementById('list');
  const fallback = [
    {date:"2026-07-23", weekday:"周四", conclusion:"今日普涨回暖、情绪偏高，但量能缩量；建议轻仓参与电网/新能源/有色主线，不追高。", file:"days/2026-07-23.html", tag:"真实聚合"},
    {date:"2026-07-22", weekday:"周三", conclusion:"今日市场偏弱、情绪低迷，建议控仓位、多看少动", file:"days/2026-07-22.html", tag:"真实聚合"}
  ];
  function render(entries){
    if(!entries || !entries.length){
      el.innerHTML='<div class="empty">还没有复盘记录，敬请期待～</div>';
      return;
    }
    el.innerHTML = entries.map(e=>`
      <a class="card" href="${e.file}">
        <div class="date">${e.date} · ${e.weekday}</div>
        <div class="day">${e.conclusion || e.summary || ''} ${e.tag?`<span class="tag">${e.tag}</span>`:''}</div>
      </a>`).join('');
  }
  fetch('manifest.json')
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(data=>{
      const entries = (data && data.entries) ? data.entries : fallback;
      render(entries);
    })
    .catch(()=>render(fallback));
</script>
</body>
</html>
